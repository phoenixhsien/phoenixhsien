<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200">
  
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&amp;display=swap');
        .bg { fill: #0D1117; }
        .border-glow { stroke: #FF8C00; stroke-width: 2.5; filter: drop-shadow(0 0 6px #FF8C00); }
        .label { font-family: 'Fira Code', monospace; font-size: 12px; fill: #FF8C00; opacity: 0.9; }
        .value { font-family: 'Fira Code', monospace; font-size: 16px; fill: #FFFFFF; font-weight: bold; }
        .poem { font-family: 'Fira Code', monospace; font-size: 9px; fill: #FF8C00; opacity: 0.6; }
        .cursor { animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>

  <rect class="bg" width="420" height="200" rx="12" />
  <rect class="border-glow" width="420" height="200" rx="12" fill="none" />

  <text x="20" y="35" class="label">[phoenix@jarvis]$ cat /home/lang_distribution</text>
  <text x="20" y="35" class="value" fill="#FF8C00" font-size="12">
    <tspan class="cursor">█</tspan>
  </text>

  <rect x="30" y="65" width="238" height="20" fill="#3776AB" rx="4" /><rect x="268" y="65" width="122" height="20" fill="#F7DF1E" rx="4" />
  <rect x="30" y="103" width="10" height="10" fill="#3776AB" rx="2" /><text x="46" y="113" class="label" font-size="11" fill="#FFFFFF">Python (66.0%)</text><rect x="220" y="103" width="10" height="10" fill="#F7DF1E" rx="2" /><text x="236" y="113" class="label" font-size="11" fill="#FFFFFF">JavaScript (34.0%)</text>

  <text x="20" y="160" class="label">Total languages: 2  |  Codebase size: 58438 KB</text>
  <text x="250" y="190" class="poem">~ my pigments of creation</text>
</svg>